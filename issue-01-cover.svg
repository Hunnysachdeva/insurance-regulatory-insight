<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Insurance Regulatory Insight — Issue 01</title>
  <desc id="desc">Minimalist navy cover with gold rule, issue number and article title</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2A4A"/>
      <stop offset="100%" stop-color="#081D34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- top rule + masthead -->
  <line x1="72" y1="96" x2="728" y2="96" stroke="#2E4560" stroke-width="1"/>
  <text x="72" y="76" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="700" fill="#C9AE6B" letter-spacing="1">INSURANCE REGULATORY INSIGHT</text>

  <!-- issue number -->
  <text x="72" y="220" font-family="Archivo, Arial, sans-serif" font-size="150" font-weight="700" fill="#13324F">01</text>
  <text x="72" y="270" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9FB0C2" letter-spacing="1">ISSUE No.</text>

  <!-- gold rule -->
  <rect x="72" y="330" width="64" height="4" fill="#A9822F"/>

  <!-- title -->
  <text x="72" y="410" font-family="Archivo, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">
    <tspan x="72" dy="0">Customer Interest</tspan>
    <tspan x="72" dy="54">Before the Sale</tspan>
  </text>

  <text x="72" y="500" font-family="Inter, Arial, sans-serif" font-size="20" fill="#CBD6E2">
    <tspan x="72" dy="0">What the latest IRDAI regulatory action</tspan>
    <tspan x="72" dy="28">means for insurers, brokers &amp; sales leaders.</tspan>
  </text>

  <!-- bottom meta -->
  <line x1="72" y1="900" x2="728" y2="900" stroke="#2E4560" stroke-width="1"/>
  <text x="72" y="936" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9FB0C2">September 2026</text>
  <text x="728" y="936" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9FB0C2" text-anchor="end">Hunny Sachdeva</text>
</svg>
